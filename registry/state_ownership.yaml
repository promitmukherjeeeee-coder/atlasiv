registry: ATLASIV State Ownership Specification
version: 0.1.0-draft
date: '2026-11-24'
status: Draft. Seed of engineering document B (World State and Data Schema). Proposed under delegated authority;
  confirmed in Pass 2.
rules:
- Every authoritative variable has exactly one owner system, the only system allowed to write it.
- Another system changes owned state only by emitting a declared event, order or ledger transaction that the owner
  validates and applies.
- Every change records its declared cause (ADR-034) so the Causal Inspector can trace it.
- Layer 0 systems are used by all others; that dependency is implicit and not repeated in the dependency map.
- OS-AI reads only its actor's OS-INFO records and writes only orders. OS-OBS and OS-UI own nothing authoritative.
- Knowledge (OS-KNOW), actor belief (OS-INFO) and capability (OS-PROD) are separate owners (AX-2, AX-8).
