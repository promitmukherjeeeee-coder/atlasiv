version: 0.1.0-draft
date: '2026-11-24'
status: Draft. Authoritative once committed to the repository (Pass 2). Chart v3.4 is generated from this file.
counts:
  levels: 4
  category_groups: 8
  workspaces: 28
  showcase_views: 10
  dossier_types: 7
  analysis_types: 6
  global_systems: 5
  analytical_patterns: 6
  menu_items: 13
id_convention:
  level: LV1 to LV4
  category_group: CG-A to CG-H
  workspace: WS-[A-H][1-6]
  showcase_view: WS-[A-H][1-6]/V[n]
  dossier_type: DS-01 to DS-07
  analysis_type: AN-01 to AN-06
  global_system: GS-01 to GS-05
  analytical_pattern: AP-01 to AP-06
  cross_link: XL-0001 onward (allocated when each link is specified)
  rule: Interface IDs never reuse mechanic codes; a bare ID such as E1 is always a mechanic.
levels:
- id: LV1
  name: Living Survey Map
  role: 'Locked core interface: world, regions, actors, conditions and actions'
- id: LV2
  name: Domain Workspaces
  role: 28 primary interfaces for management, planning, operations and policy
- id: LV3
  name: Entity and System Dossiers
  role: Detailed multi-aspect views of entities, organisations, places, systems, processes and knowledge artifacts
- id: LV4
  name: Analytical Investigations
  role: 'Causal, comparative and historical analysis: causes, effects, scenarios, what-if, replay, forecast'
navigation:
- 'Contextual, not sequential: any level opens from the map, a workspace, a dossier or an analysis.'
- Navigation preserves selected entity, geographic focus, layers, historical date, open dossier, workspace, filters
  and comparison selection (U1).
- One shared entity-selection service (GS-05, U2) lets every workspace render its own view of the same entity.
