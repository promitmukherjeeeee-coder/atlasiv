- id: P5
  name: Settlement formation
  series: P
  owner: OS-SETTLE
  layer: 2
  summary: Camp, village, town, city, driven by surplus, storage, defense and water. One city per administrative
    region; a second city needs lawful reorganisation (P32, ADR-045), and subdivision alone never creates city capacity
    (exploit test, revised 25 and 26 Nov 2026).
  declared_links:
  - P32
- id: P6
  name: Settlement costs
  series: P
  owner: OS-SETTLE
  layer: 2
  summary: City and town costs rise steeply, derived mainly from land, infrastructure, labour, administration and
    resource constraints; any remaining geometric factor is a labelled, justified gameplay abstraction (revised
    25 Nov 2026).
- id: P7
  name: Districts and buildings
  series: P
  owner: OS-SETTLE
  layer: 2
  summary: 'Unique districts, buildings and upgrades for each settlement type. Extended by P35 and R32 (26 Nov 2026):
    districts are repeatable, mixed-use geographic units, and building capacity is a derived summary, not a slot
    ledger.'
  declared_links:
  - P35
  - R32
- id: P8
  name: Adjacency
  series: P
  owner: OS-SETTLE
  layer: 2
  summary: Fixed, typed adjacency bonuses between contiguous neighbours (owner-confirmed 26 Nov 2026, superseding
    the 25 Nov wording). A district, improvement or site earns one bonus of each type for which it has a qualifying
    neighbour (settlement, district, building, landmark or natural feature), so one district can hold several types.
    Each type has a fixed value; it counts once (non-stacking), types add, a
  declared_links:
  - P35
  - R32
  - R33
- id: P9
