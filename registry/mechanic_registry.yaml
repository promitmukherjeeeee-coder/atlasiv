- id: K40
  name: Knowledge artifact entity
  series: K
  owner: OS-KNOW
  layer: 3
  summary: 'Generalised identity for every artifact class, with sparse domain components, permanent IDs and provenance.
    Significant works individual, ordinary production aggregated. Extends K5, K21. Owner: knowledge system.'
  declared_links:
  - K21
  - K5
- id: K41
  name: Claim-level knowledge
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Typed claims, findings, methods and datasets inside artifacts, with relationships (supports, contradicts,
    replicates, revises, supersedes, translates, summarises, extends, derives from, corroborates, depends on, applies,
    refutes) and epistemic categories. Used only where it matters.
- id: K42
  name: Content, copies and editions
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Content separate from physical and digital carriers, editions, translations, revisions and locations;
    non-rivalrous content, rivalrous media. Copies are DS-05 assets owned by resource accounting.
- id: K43
  name: Custody, ownership, rights and access
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Twelve distinct properties at individual, institution, organisation, government, population-group, civilisation
    and international levels, with access granularity (metadata to source code). Extends E22, S27.
  declared_links:
  - E22
  - S27
- id: K44
  name: Knowledge lifecycle
  series: K
  owner: OS-KNOW
  layer: 3
  summary: The fourteen states and their transitions, bottlenecks, throughput, costs, delays and failures, non-linear
    and domain-specific. Extends K3, K4, K17.
  declared_links:
  - K17
  - K3
  - K4
- id: K45
  name: Acquisition channels
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Acquisition through existing economic, legal, diplomatic, institutional, military, migration, intelligence
    and information systems; method sets cost, legality, secrecy, provenance, delay and risk.
- id: K46
  name: Transmission media
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Era-independent media with latency, reach, bandwidth, reproduction cost, infrastructure, energy, reliability,
    preservation, censorship, language, security and interoperability. Extends P18, E13, S20.
  declared_links:
  - E13
  - P18
  - S20
- id: K47
  name: Open-network publication
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Publication scopes reachable by all connected, permitted, capable actors, resolved by scopes and lazy
    queries.
- id: K48
  name: Absorptive capacity
  series: K
  owner: OS-INST
  layer: 3
  summary: Discipline-specific, time-based absorption with decay through turnover, collapse and disuse. Extends
    K4, K26, K30.
  declared_links:
  - K26
  - K30
  - K4
- id: K49
  name: Forms of knowledge
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Codified, tacit, institutional, embodied, distributed, operational and dormant knowledge, with tacit
    transfer through apprenticeship, education, migration, employment, joint research and assistance.
- id: K50
  name: Operational capability and deployment
  series: K
  owner: OS-PROD
  layer: 2
  summary: 'Per actor, region, institution and industry: known, understood, demonstrated, prototype, limited reproduction,
    commercially feasible, deployed, adopted, unavailable, obsolete, known but no longer reproducible. Deployment
    consumes real resources through production chains. Extends K29, R21, R27.'
  declared_links:
  - K29
  - R21
  - R27
- id: K51
  name: Capability regression and restoration
  series: K
  owner: OS-PROD
  layer: 2
  summary: Regression from decayed dependencies with documentation surviving; restoration from surviving knowledge,
    expertise, infrastructure and relationships. Extends K10, K34.
  declared_links:
  - K10
  - K34
- id: K52
  name: Institutional knowledge collections
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Owned, custodial, licensed, shared, restricted, untranslated and damaged holdings; collection capabilities
    (cataloguing, translation, authentication, retrieval, dissemination); survival through succession and collapse.
    Extends I1, I15, K32.
  declared_links:
  - I1
  - I15
  - K32
- id: K53
  name: Knowledge synthesis
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Universal, recursive research capability producing new attributable artifacts; feasibility and quality
    from coverage, independence, reliability, competence and hard prerequisites, never book counts.
- id: K54
  name: Source independence and provenance
  series: K
  owner: OS-KNOW
  layer: 3
