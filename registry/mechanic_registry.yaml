    capacity, research infrastructure and accumulated expertise. Scientific accessibility does not grant research
    eligibility. Requirements are functional, not institution-name-specific. Extends K1, K4 and K18.
  declared_links:
  - K1
  - K18
  - K4
- id: K25
  name: Progressive scientific specialisation
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Rising scientific complexity creates demand for specialised disciplines, departments, laboratories, programmes
    and independent research organisations. Generalist institutions keep historically appropriate capabilities and
    may develop specialised internal structures.
- id: K26
  name: Research competence and maturity
  series: K
  owner: OS-INST
  layer: 3
  summary: Competence accumulates through research activity, education, mentorship, experimentation, equipment use
    and organisational continuity. New institutions inherit only capabilities actually transferred to them. Competence
    decays through inactivity, disruption, obsolescence or loss of personnel.
- id: K27
  name: Research portfolio and allocation
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Institutions allocate personnel, funding, equipment, compute, facilities and other inputs among eligible
    programmes by mandate, objectives, incentives and authority. Commitments cannot be duplicated across simultaneous
    programmes.
- id: K28
  name: Interdisciplinary research
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Programmes can combine competence from several domains and institutions. Contributions depend on expertise,
    knowledge compatibility, coordination capacity, information access and contracts.
- id: K29
  name: Research activity differentiation
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Basic research, applied research and engineering development have distinct objectives, inputs, institutional
    requirements and outputs. Discoveries, technical designs, validated prototypes, adoption and mastery are tracked
    separately.
- id: K30
  name: Scientific labour mobility and succession
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Researchers migrate, retire, die, change employers, train successors and found scientific schools. Skilled
    labour and mentorship networks shape competence, continuity, diffusion and brain drain. Extends K12, K19, P4
    and S5.
  declared_links:
  - K12
  - K19
  - P4
  - S5
- id: K31
  name: Scientific freedom and research restrictions
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Laws, religious authority, political interference, institutional governance, commercial secrecy, censorship
    and security restrictions affect eligibility, priorities, publication and collaboration, with context-specific
    consequences, not universal penalties.
- id: K32
  name: Research infrastructure dependencies
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Laboratories, libraries, archives, observatories, experimental facilities, computing systems and testing
    infrastructure deliver research capability, subject to operating capacity, maintenance, energy, materials, skilled
    labour and technical compatibility.
- id: K33
  name: Scientific collaboration and competition
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Institutions pursue discoveries alone or jointly. Parallel discoveries keep separate provenance. Collaboration
    creates attributable contributions, and competition shapes incentives, recruitment, secrecy, intellectual property
    and priorities. Extends K7, K21 and I7.
  declared_links:
  - I7
  - K21
  - K7
- id: K34
  name: Institutional knowledge continuity and loss
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Dissolution, war, persecution, migration, destruction and decline can reduce research capacity, competence,
    technical knowledge or mastery independently. Archives, distributed expertise and successor institutions can
    preserve or recover part of the loss.
- id: K35
  name: Scientific discovery and institutional feedback
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Discoveries open new institutional mandates, specialised capabilities and subtrees. Institutional development
    then widens eligible research and modifies the discovery hazard.
- id: K36
  name: Research contribution and provenance accounting
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Discoveries and programmes keep attributable contributions from researchers, institutions, sponsors and
    collaborators. Financial contribution, scientific contribution, intellectual property ownership and operational
    control stay distinct. Shared achievements reconcile without duplicated scoring credit.
- id: K37
  name: Research aggregation and explainability
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Aggregate research indicators derive from institution-specific and domain-specific activity, and distinguish
    available capacity, committed capacity, realised output, annual rates, accumulated progress and uncertainty.
    Aggregate output is not spendable research points.
- id: K38
  name: Research resolution and conservation
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Invention, diffusion and competence updates follow the knowledge-system cadence (turn end). Relevant
    phase events change effective resources and institutional conditions through phase deltas. Calculations use
    elapsed time, deterministic resolution and seeded discovery streams. Funding, personnel, materials, equipment
    and compute reconcile with their authoritative systems.
- id: K39
  name: Research scalability
  series: K
  owner: OS-KNOW
  layer: 3
  summary: Ordinary researchers are population and occupational aggregates. Notable scientists are characters. Institutions
    have persistent identities, while departments and programmes are aggregated records unless significance requires
    more. Resolution evaluates eligible active programmes and their dependencies, not every institution-technology
    pair.
- id: S27
  name: Authority requirement
  series: S
  owner: OS-POLITY
  layer: 3
  summary: Every order needs legal authority and enforcement capacity. Illegal attempts are explicit political acts.
- id: S28
  name: Administrative capacity
  series: S
  owner: OS-POLITY
  layer: 3
