registry: ATLASIV Mechanic Registry
version: 0.1.0-draft
date: '2026-11-24'
status: Draft generated from Mechanics Brainstorm (26 Nov 2026). Owners and layers proposed; confirmed in Pass 2
  and Pass 2b.
source: Mechanics Brainstorm tab
link_semantics: declared_links = IDs this entry explicitly extends, absorbs or references in the documents. Not
  yet variable-level inputs and outputs; those come from each 21-field specification.
mechanics:
- id: T1
  name: Variable turn length
  series: T
  owner: OS-TIME
  layer: 0
  summary: Stepped lengths from 50 years down to 1 month. All rates are stored per year, and the world's tempo follows
    the leading edge. Each step has a phase count (20, 10, 10, 5, 4, 4, 3 and 5 phases per turn).
- id: T2
  name: Standing orders
  series: T
  owner: OS-TIME
  layer: 0
  summary: Multi-turn orders (migrations, builds, trade routes) progress per phase, carry across turns, and raise
    alerts only on exceptions. Development orders add priorities, spending limits, expiry and triggers (A17).
  declared_links:
  - A17
- id: T3
  name: Seasonal aggregation
  series: T
  owner: OS-TIME
  layer: 0
  summary: Long turns still run harvest, flood and migration cycles inside the turn, so annual rhythms matter even
    at 50-year turns. Precomputed annual profiles per biome drive them.
- id: T4
  name: Event queue
  series: T
  owner: OS-TIME
  layer: 0
  summary: Scheduled and conditional events resolve in a fixed order each phase.
- id: T5
  name: Calendar
  series: T
  owner: OS-TIME
  layer: 0
  summary: BCE/CE dating (owner decision 24 Nov 2026), era names, cultural calendars.
- id: T6
  name: History log
  series: T
  owner: OS-EVENT
  layer: 0
  summary: Every state change is logged. The log feeds scoring, the chronicle and replays.
- id: T7
  name: Country switching
  series: T
  owner: OS-AI
  layer: cross-cutting
  summary: The player can switch to any country at a phase boundary (Europa Universalis tag style). The country
    left returns to AI control, and each entity keeps its own history and score lineage.
- id: T8
  name: Action phases
  series: T
  owner: OS-TIME
  layer: 0
  summary: Each turn is divided into phases, which are the tick for fast systems and for the player's decisions.
    The phase count scales with the turn step so each decision covers a comparable stretch of felt history.
- id: T9
  name: Phase resolution order and phase deltas
  series: T
  owner: OS-TIME
  layer: 0
  summary: Planning, then resolution in a fixed order (standing orders and events, diplomacy, covert operations,
    movement and migration, combat, sieges and naval action, character events, unrest). Phase events that touch
    slow systems are recorded as phase deltas and consumed by the turn-end tick.
- id: T10
  name: Advance until and exceptions
  series: T
  owner: OS-TIME
  layer: 0
  summary: Run phases and turns automatically until a trigger needs a decision (war declared, army enters territory,
    succession crisis, first contact, disaster, plot discovered, treaty offer, project milestone, famine, new technology).
    Quiet phases auto-skip.
- id: T11
  name: Tempo trigger
  series: T
  owner: OS-TIME
  layer: 0
  summary: The leading edge is the fastest transport capability held by any entity with at least 0.5% of world population.
    The step switches when its candidate differs for 10 consecutive turns (faster) or 20 (slower), with at least
    20 turns between switches. Each switch is an announced era-transition event (K9), and steps can slow again after
    a global collapse.
  declared_links:
  - K9
- id: W1
  name: Height field
  series: W
  owner: OS-TERRAIN
  layer: 1
  summary: A fine height map, collapsed into four gameplay bands (lowland, plateau, highland, mountain).
- id: W2
  name: Tectonics
  series: W
  owner: OS-TERRAIN
  layer: 1
  summary: Slow uplift, volcanoes, earthquake zones.
- id: W3
  name: Hydrology
  series: W
  owner: OS-HYDRO
  layer: 1
  summary: Flow accumulation makes rivers. Rivers carve valleys, flood, shift course, form deltas, lakes and marshes.
    Dams and canals change flow.
- id: W4
  name: Soil and erosion
  series: W
  owner: OS-TERRAIN
  layer: 1
  summary: Fertility, depletion, salinization from irrigation, erosion after deforestation.
- id: W5
  name: Sea level and ice
  series: W
  owner: OS-TERRAIN
  layer: 1
  summary: Eustatic rise and fall, glaciers and ice sheets, coastal flooding.
- id: W6
  name: Climate model
  series: W
  owner: OS-CLIMATE
  layer: 1
  summary: Temperature, precipitation, seasonality, monsoons, ocean currents, multi-year oscillations, solar and
    volcanic cycles.
- id: W7
  name: Greenhouse feedback
  series: W
  owner: OS-CLIMATE
  layer: 1
  summary: Emissions, carbon cycle, albedo, permafrost thaw, warming.
- id: W8
  name: Biome dynamics
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: 'Biomes convert when climate thresholds hold for long enough, with lag. Examples: desertification, forest
    advance, tundra thaw.'
- id: W9
  name: Vegetation and fire
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: Succession, wildfire regimes, grazing pressure.
- id: W10
  name: Disasters
  series: W
  owner: OS-HAZARD
  layer: 1
  summary: Floods, droughts, quakes, eruptions, storms, wildfires, tsunamis, pandemics, rare impacts. Probability
    follows geography, and tech and infrastructure mitigate.
- id: W11
  name: Deposits
  series: W
  owner: OS-DEPOSIT
  layer: 1
  summary: Mineral families and mining clusters (one site, several resources) with discovery by prospecting and
    tech.
- id: W12
  name: Animal populations
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: Per-species density, carrying capacity, growth and decline, predator-prey links, migration routes.
- id: W13
  name: Extinction and extirpation
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: Overhunting, habitat loss, invasive species. Extinct species stay gone.
- id: W14
  name: Animal kingdoms and biocycles
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: Herbivore, predator, scavenger and marine guilds with seasonal and boom-bust cycles.
- id: W15
  name: Natural exploitation
  series: W
  owner: OS-PROD
  layer: 2
  summary: Hunting, fishing, foraging, logging, quarrying, each with a sustainable yield and a collapse threshold.
- id: W16
  name: Disease ecology
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: Zoonoses, vectors, epidemics linked to density, trade and climate.
- id: W17
  name: Domestication
  series: W
  owner: OS-ECOLOGY
  layer: 1
  summary: Plants and animals domesticated by region (real cradle packages), which sets farming and herding options.
- id: P1
  name: Population groups
  series: P
  owner: OS-POP
  layer: 2
